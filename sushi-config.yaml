# SUSHI configuration, see https://fshschool.org/docs/sushi/configuration/

id: fudickar-lab.whir
canonical: https://fudickar-lab.github.io/WHIR
name: WHIR
title: WHIR (Wearable Health Interoperable Records) Implementation Guide
description: Representation of wearable inertial measurement unit (IMU) recordings in FHIR R5, from device and sensor metadata through raw data to activity labels, with use cases for machine learning and automatic geriatric assessment at home.
status: draft
version: 0.1.0
fhirVersion: 5.0.0
copyrightYear: 2024+
releaseLabel: ci-build

publisher:
  name: IMU Wearable R5 Publisher

dependencies:
  # PHD IG, defines the ContinuaDeviceIdentifiers code system
  hl7.fhir.uv.phd: 2.0.0

menu:
  Home: index.html
  Artifacts: artifacts.html

instanceOptions:
  manualSliceOrdering: true

# Artifacts page sections. Examples are grouped by use case (input/fsh/examples/use-case-1 and use-case-2).
groups:
  Profiles:
    name: Profiles
    description: "Profiles for IMU devices, sensor placement, raw data, activity labels and the geriatric assessment."
    resources:
      - StructureDefinition/imu-sensor-placement
      - StructureDefinition/geriatric-exercise-care-plan
      - StructureDefinition/imu-device-metric
      - StructureDefinition/imu-sensor-device
      - StructureDefinition/geriatric-assessment-report
      - StructureDefinition/activity-label-observation
      - StructureDefinition/long-raw-sensor-modality-observation
      - StructureDefinition/geriatric-exercise-prescription
  Extensions:
    name: Extensions
    description: "Extensions for sensor placement and activity label provenance."
    resources:
      - StructureDefinition/body-structure-attachment-method
      - StructureDefinition/body-structure-placement-qualifier
      - StructureDefinition/observation-annotation-confidence
      - StructureDefinition/observation-annotation-provenance
  Terminology:
    name: Terminology
    description: "Code systems and value sets."
    resources:
      - CodeSystem/placement-qualifier-cs
      - CodeSystem/attachment-method-cs
      - CodeSystem/har-activity-labels-cs
      - CodeSystem/geriatric-assessment-labels-cs
      - CodeSystem/adl-labels-cs
      - CodeSystem/annotation-provenance-cs
      - CodeSystem/sensor-modality-cs
      - CodeSystem/sensor-axis-cs
      - ValueSet/imu-sensor-device-categories
      - ValueSet/imu-sensor-types
      - ValueSet/har-body-locations
      - ValueSet/placement-qualifier
      - ValueSet/imu-device-metric-type
      - ValueSet/attachment-method
      - ValueSet/har-activity-labels
      - ValueSet/geriatric-assessment-labels
      - ValueSet/adl-labels
      - ValueSet/activity-labels
      - ValueSet/annotation-provenance
      - ValueSet/sensor-modality
      - ValueSet/sensor-axis
      - ValueSet/imu-sensor-units
